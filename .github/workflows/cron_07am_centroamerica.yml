name: ?? Campaña Centroamérica 7:00 AM CST (Bufetes & CFOs Reales)

on:
  schedule:
    # 7:00 AM CST = 13:00 UTC (Lunes a Viernes)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  dispatch_centroamerica:
    name: Despacho Centroamérica 7:00 AM en la Nube
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      APP_URL: https://audiflowai.com
      NODE_ENV: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --omit=dev

      - name: Execute Centroamerica Daily Sower (100% Real - Cero Simulación)
        run: node scripts/dispatch_centroamerica_8am_cron.mjs
