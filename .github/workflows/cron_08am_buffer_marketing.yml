name: ☀️ Publicación Redes Buffer 8:00 AM CST (LinkedIn, FB, IG)

on:
  schedule:
    # 8:00 AM CST = 14:00 UTC (Lunes a Domingo)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  publish_buffer_8am:
    name: Publicación Matutina Buffer 8:00 AM en la Nube
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      APP_URL: https://audiflowai.com
      NODE_ENV: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --omit=dev

      - name: Publish Morning Trend via Buffer
        run: node scripts/buffer_daily_publisher_8am.mjs
