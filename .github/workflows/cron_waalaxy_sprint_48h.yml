name: 🛰️ Campaña Waalaxy LinkedIn (Puente 14 Días Warmup Instantly)

on:
  schedule:
    # Dos tandas al día: 9:00 AM CST (15:00 UTC) y 3:00 PM CST (21:00 UTC)
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  waalaxy_sprint:
    name: Despacho Lote Waalaxy LinkedIn (Puente Warmup 14 Días)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      INSTANTLY_ACTIVE: 'warmup'
      OUTREACH_EMAIL: 'ricardo.audiflowai@gmail.com'
      APP_URL: https://audiflowai.com
      NODE_ENV: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --omit=dev

      - name: Execute Waalaxy LinkedIn Campaign
        run: node scripts/dispatch_waalaxy_medianos_campaign.js
