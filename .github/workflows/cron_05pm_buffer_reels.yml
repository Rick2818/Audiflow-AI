name: 🌇 Publicación Vespertina Buffer 5:00 PM CST (Reels / Audiovisual)

on:
  schedule:
    # 5:00 PM CST = 23:00 UTC (Lunes a Domingo)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  publish_buffer_5pm:
    name: Publicación Vespertina Buffer 5:00 PM en la Nube
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      APP_URL: https://audiflowai.com
      NODE_ENV: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --omit=dev

      - name: Publish Evening Reel via Buffer
        run: node scripts/buffer_daily_publisher_5pm.mjs
