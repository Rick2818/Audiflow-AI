<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Matte Background -->
    <linearGradient id="bgGoldMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="50%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#14120f"/>
    </linearGradient>

    <!-- Royal Brushed Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3d6"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#b8932b"/>
      <stop offset="100%" stop-color="#8a6b18"/>
    </linearGradient>

    <!-- Subtle Gold Ambient Sheen Filter -->
    <filter id="goldAmbientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGoldMaster)"/>

  <!-- Subtle Circular Safe Border for Social Networks -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.25" stroke-dasharray="8,8"/>

  <!-- Soft Gold Ambient Behind Monogram -->
  <circle cx="270" cy="230" r="140" fill="#d4af37" opacity="0.08" filter="url(#goldAmbientGlow)"/>

  <!-- Pure Geometric 'A' Monogram -->
  <g transform="translate(100, 90)">
    <!-- Left Leg: Solid Titanium White (Legal Rigor & Transparency) -->
    <path d="M 50 250 L 138 35 L 176 35 L 88 250 Z" fill="#ffffff"/>
    
    <!-- Right Leg: Royal Gold (Financial Value & AI Trust) -->
    <path d="M 132 35 L 170 35 L 250 250 L 212 250 Z" fill="url(#goldGradient)"/>
    
    <!-- Golden Ratio Floating Crossbar -->
    <rect x="94" y="152" width="112" height="24" rx="5" fill="url(#goldGradient)"/>
  </g>

  <!-- Brand Signature (Centered & Safe for Circular Crop) -->
  <text x="250" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="6">
    AUDIFLOW<tspan fill="url(#goldGradient)">AI</tspan>
  </text>
</svg>
